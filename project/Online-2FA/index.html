<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="description" content="纯前端 TOTP / 2FA 验证码生成器。密钥只在浏览器计算，可部署到 GitHub Pages。" />
    <title>本机验证器</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="toast" class="toast" role="status"></div>

    <div id="lock-screen" class="lock hidden">
      <form id="unlock-form">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24">
            <circle cx="16" cy="16" r="9.2" fill="none" stroke="#c5cdd6" stroke-width="2.2"/>
            <path d="M16 8.2v6.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="16" cy="16" r="2.1" fill="currentColor"/>
          </svg>
        </div>
        <h1 id="unlock-title" style="margin-top:1rem;font-size:1.25rem">令牌库已锁定</h1>
        <p id="unlock-hint" class="sub" style="color:var(--muted);font-size:0.875rem;margin:0.35rem 0 0">输入密码解密本机数据。</p>
        <div class="field" style="margin-top:1rem">
          <input id="unlock-pw" type="password" autocomplete="current-password" />
        </div>
        <p id="unlock-err" class="err hidden"></p>
        <button class="btn btn-primary" type="submit" id="unlock-btn" style="width:100%;margin-top:1rem;justify-content:center">解锁</button>
      </form>
    </div>

    <div id="app">
      <header class="header">
        <div class="wrap header-inner">
          <div class="brand">
            <span class="mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" width="24" height="24">
                <circle cx="16" cy="16" r="9.2" fill="none" stroke="currentColor" stroke-width="2.2"/>
                <path d="M16 8.2v6.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="16" cy="16" r="2.1" fill="currentColor"/>
              </svg>
            </span>
            <div>
              <h1 id="brand">本机验证器</h1>
              <p id="tagline">密钥只在浏览器里计算，不会上传</p>
            </div>
          </div>
          <div>
            <button class="icon-btn" id="btn-add" type="button" aria-label="添加">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="icon-btn" id="btn-settings" type="button" aria-label="设置">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main class="wrap main">
        <p id="insecure" class="banner hidden"></p>
        <div class="tabs">
          <button type="button" id="tab-quick" class="active">即时生成</button>
          <button type="button" id="tab-vault">令牌库<span class="count" id="vault-count"></span></button>
        </div>

        <section id="panel-quick" class="card">
          <label class="field">
            <span id="lbl-secret">密钥</span>
            <textarea id="secret" spellcheck="false" autocomplete="off" placeholder="粘贴 Base32 密钥，或 otpauth:// 链接"></textarea>
          </label>
          <div class="row two">
            <label class="field">
              <span id="lbl-issuer">发行方</span>
              <input id="issuer" />
            </label>
            <label class="field">
              <span id="lbl-account">账号</span>
              <input id="label" />
            </label>
          </div>
          <button type="button" class="linkish" id="toggle-adv">高级选项</button>
          <div class="adv" id="adv">
            <div class="row two">
              <label class="field"><span id="lbl-type">类型</span>
                <select id="type">
                  <option value="totp">TOTP</option>
                  <option value="hotp">HOTP</option>
                  <option value="steam">Steam Guard</option>
                </select>
              </label>
              <label class="field"><span id="lbl-encoding">密钥格式</span>
                <select id="encoding">
                  <option value="base32">Base32</option>
                  <option value="hex">Hex</option>
                  <option value="ascii">ASCII</option>
                </select>
              </label>
              <label class="field"><span id="lbl-alg">算法</span>
                <select id="algorithm">
                  <option value="SHA-1">SHA-1</option>
                  <option value="SHA-256">SHA-256</option>
                  <option value="SHA-512">SHA-512</option>
                </select>
              </label>
              <label class="field"><span id="lbl-digits">位数</span>
                <select id="digits">
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
              </label>
              <label class="field" id="field-period"><span id="lbl-period">周期（秒）</span>
                <select id="period">
                  <option value="15">15</option>
                  <option value="30" selected>30</option>
                  <option value="60">60</option>
                </select>
              </label>
              <label class="field hidden" id="field-counter"><span id="lbl-counter">计数器</span>
                <input id="counter" type="number" min="0" value="0" />
              </label>
            </div>
          </div>
          <div class="code-box">
            <div id="code-live" class="code-row hidden">
              <button type="button" class="code" id="code"></button>
              <div class="ring" id="ring">
                <svg viewBox="0 0 36 36" aria-hidden="true">
                  <circle cx="18" cy="18" r="15" fill="none" stroke="var(--border-strong)" stroke-width="3"/>
                  <circle id="ring-arc" cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="0"/>
                </svg>
                <b id="ring-num">30</b>
              </div>
            </div>
            <p id="waiting" class="waiting"></p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="btn-copy" type="button">复制</button>
            <button class="btn btn-secondary" id="btn-qr" type="button">生成二维码</button>
            <button class="btn btn-secondary" id="btn-save" type="button">存入令牌库</button>
            <button class="btn btn-ghost" id="btn-demo" type="button">填入测试密钥</button>
          </div>
        </section>

        <section id="panel-vault" class="hidden">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input id="search" />
          </div>
          <div id="vault-empty" class="empty hidden">
            <h2 id="empty-title">令牌库是空的</h2>
            <p id="empty-hint"></p>
            <button class="btn btn-primary" id="empty-add" type="button" style="margin-top:1.25rem">添加令牌</button>
          </div>
          <p id="no-match" class="waiting hidden" style="text-align:center;padding:2.5rem 0"></p>
          <div id="vault-list"></div>
        </section>

        <p class="footer" id="footer">RFC 6238 · 纯前端 · 可离线</p>
      </main>
    </div>

    <div class="overlay" id="modal-add">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h2 id="add-title">添加令牌</h2>
            <p id="add-desc"></p>
          </div>
          <button class="icon-btn" type="button" data-close="modal-add" aria-label="关闭">×</button>
        </div>
        <div class="seg" id="add-methods">
          <button type="button" data-method="manual" class="active">手动</button>
          <button type="button" data-method="uri">链接</button>
          <button type="button" data-method="scan">扫描</button>
          <button type="button" data-method="image">图片</button>
        </div>
        <div id="add-manual">
          <div class="row two">
            <label class="field"><span class="lbl-issuer">发行方</span><input id="add-issuer" /></label>
            <label class="field"><span class="lbl-account">账号</span><input id="add-label" /></label>
          </div>
          <label class="field"><span class="lbl-secret">密钥</span><textarea id="add-secret"></textarea></label>
        </div>
        <div id="add-uri" class="hidden">
          <label class="field"><span id="lbl-uri">otpauth 链接</span><textarea id="add-uri-input"></textarea></label>
        </div>
        <div id="add-scan" class="hidden">
          <p id="scan-hint" class="waiting"></p>
          <video id="scan-video" class="scan" muted playsinline></video>
          <div class="actions">
            <button class="btn btn-primary" id="btn-cam" type="button">打开摄像头</button>
          </div>
        </div>
        <div id="add-image" class="hidden">
          <p class="waiting scan-hint-dup"></p>
          <input id="add-file" type="file" accept="image/*" />
        </div>
        <p id="add-err" class="err hidden"></p>
        <div class="actions" id="add-actions">
          <button class="btn btn-ghost" type="button" data-close="modal-add">取消</button>
          <button class="btn btn-primary" id="btn-add-confirm" type="button">添加</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="modal-settings">
      <div class="modal">
        <div class="modal-head">
          <div><h2 id="set-title">设置</h2></div>
          <button class="icon-btn" type="button" data-close="modal-settings" aria-label="关闭">×</button>
        </div>
        <div class="row two">
          <label class="field"><span id="lbl-lang">语言</span>
            <select id="set-lang"><option value="zh">中文</option><option value="en">English</option></select>
          </label>
          <label class="field"><span id="lbl-theme">外观</span>
            <select id="set-theme">
              <option value="system">跟随系统</option>
              <option value="dark">深色</option>
              <option value="light">浅色</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span id="lbl-offset">时钟校准</span>
          <input id="set-offset" type="range" min="-30" max="30" value="0" />
          <span class="hint" id="offset-hint"></span>
        </label>
        <div class="card" style="box-shadow:none;padding:1rem;border-radius:var(--radius-md);background:var(--elevated)">
          <h3 id="lock-label" style="font-size:0.875rem">密码锁</h3>
          <div class="row two" style="margin-top:0.75rem">
            <label class="field"><span id="lbl-pw">密码</span><input id="set-pw1" type="password" /></label>
            <label class="field"><span id="lbl-pw2">确认密码</span><input id="set-pw2" type="password" /></label>
          </div>
          <div class="actions">
            <button class="btn btn-primary btn-sm" id="btn-set-pw" type="button">设置解锁密码</button>
            <button class="btn btn-secondary btn-sm hidden" id="btn-clear-pw" type="button">移除密码</button>
          </div>
        </div>
        <div class="actions" style="margin-top:1rem">
          <button class="btn btn-secondary btn-sm" id="btn-export-json" type="button">导出 JSON</button>
          <button class="btn btn-secondary btn-sm" id="btn-export-uri" type="button">导出 otpauth</button>
          <button class="btn btn-secondary btn-sm" id="btn-import" type="button">导入备份</button>
          <button class="btn btn-ghost btn-sm btn-danger" id="btn-wipe" type="button">清空本机数据</button>
        </div>
        <input id="import-file" type="file" accept=".json,.txt,application/json,text/plain" class="hidden" />
        <p id="set-msg" class="ok hidden"></p>
        <div style="border-top:1px solid var(--border);margin-top:1rem;padding-top:1rem">
          <h3 id="about-title" style="font-size:0.875rem">关于</h3>
          <p id="about-body" style="color:var(--muted);font-size:0.875rem;line-height:1.6;margin:0.5rem 0 0"></p>
          <h3 id="sec-title" style="font-size:0.875rem;margin-top:1rem">安全说明</h3>
          <p id="sec-body" style="color:var(--muted);font-size:0.875rem;line-height:1.6;margin:0.5rem 0 0"></p>
        </div>
      </div>
    </div>

    <div class="overlay" id="modal-qr">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h2 id="qr-title">验证二维码</h2>
            <p id="qr-hint"></p>
          </div>
          <button class="icon-btn" type="button" data-close="modal-qr" aria-label="关闭">×</button>
        </div>
        <div class="qr-box">
          <img id="qr-img" alt="QR" />
          <p class="uri" id="qr-uri"></p>
        </div>
      </div>
    </div>

    <script src="./vendor/qrcode.min.js"></script>
    <script src="./vendor/jsQR.min.js"></script>
    <script src="./js/totp.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
