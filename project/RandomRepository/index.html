<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
  <script>
    (async () => {
      const api = 'https://api.github.com/users/NeetheCheeBao/repos?per_page=100&type=owner';
      const proxy = 'https://corsproxy.io/?' + encodeURIComponent(api);

      try {
        const res = await fetch(proxy);
        if (!res.ok) throw new Error();
        const repos = await res.json();

        const exclude = new Set(['neethecheebao.github.io', '.github']);
        const list = repos
          .filter(r => !exclude.has(r.name) && !r.fork)
          .map(r => r.html_url);

        if (list.length === 0) {
          location.replace('https://github.com/NeetheCheeBao?tab=repositories');
          return;
        }

        const url = list[Math.floor(Math.random() * list.length)];
        location.replace(url);
      } catch {
        location.replace('https://github.com/NeetheCheeBao?tab=repositories');
      }
    })();
  </script>
</head>
<body></body>
</html>
